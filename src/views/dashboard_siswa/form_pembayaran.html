<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pembayaran SPP - Siswa</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Placeholder -->
        <div id="sidebar-root" style="display: flex; height: 100vh;"></div>

        <!-- Main Content -->
        <main class="main-content">
            <h2>Bayar SPP</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Silakan isi formulir di bawah ini untuk membayar SPP.</p>

            <div style="display: grid; grid-template-columns: 1fr 350px; gap: 2rem; align-items: start;">
                <div class="card">
                    <!-- Endpoint matches our PaymentController route -->
                    <form action="/api/payment/submit" method="POST" enctype="multipart/form-data">
                        <div class="form-group">
                            <label>Nama Lengkap</label>
                            <input type="text" name="nama_siswa" id="form-nama" class="form-control" readonly required style="background-color: var(--background);">
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                            <div class="form-group">
                                <label>Kelas</label>
                                <input type="text" name="kelas" id="form-kelas" class="form-control" readonly required style="background-color: var(--background);">
                            </div>
                            <div class="form-group">
                                <label>Jurusan</label>
                                <input type="text" name="jurusan" id="form-jurusan" class="form-control" readonly required style="background-color: var(--background);">
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                            <div class="form-group">
                                <label>NISN</label>
                                <input type="text" name="nisn" id="form-nisn" class="form-control" readonly required style="background-color: var(--background);">
                            </div>
                            <div class="form-group">
                                <label for="no_spp">Nomor SPP (Referensi)</label>
                                <input type="text" id="no_spp" name="no_spp" class="form-control" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="bulan_spp">Bulan Pembayaran <span style="font-size: 0.8rem; color:var(--text-muted)">(Klik dari modul kanan)</span></label>
                            <input type="month" id="bulan_spp" name="bulan_spp" class="form-control" required readonly style="background-color: var(--background); border-color: var(--primary);">
                        </div>

                        <div class="form-group">
                            <label for="nominal">Nominal Tagihan (Rp)</label>
                            <input type="number" id="nominal" name="nominal" class="form-control" required readonly style="background-color: var(--background); font-weight: bold; color: var(--primary);">
                        </div>

                        <div class="form-group">
                            <label for="receipt">Bukti Transfer (Max 2MB, .jpg/png)</label>
                            <input type="file" id="receipt" name="receipt" class="form-control" accept=".jpg,.jpeg,.png" required>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Kirim Pembayaran</button>
                    </form>
                </div>

                <!-- Modul Tagihan Bulanan -->
                <div class="card" style="position: sticky; top: 100px;">
                    <h3 style="margin-bottom: 0.5rem; font-size: 1.1rem; color: var(--primary);">Formulir Tagihan</h3>
                    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.5rem;">Pilih tagihan bulan yang ingin Anda bayarkan atau transaksikan ulang.</p>
                    <div id="tagihan-list" style="display: flex; flex-direction: column; gap: 0.75rem;">
                        <!-- JS injected -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/components/sidebar.js"></script>
    <script>
        // Render Sidebar for Siswa
        SidebarComponent.render('siswa', '/dashboard_siswa/form_pembayaran.html');

        // Fetch profile data to auto-fill the form
        fetch('/api/users/profile')
            .then(res => res.json())
            .then(data => {
                if(data && !data.error) {
                    document.getElementById('form-nama').value = data.nama_siswa || '';
                    document.getElementById('form-kelas').value = data.kelas || '';
                    document.getElementById('form-jurusan').value = data.jurusan || '';
                    document.getElementById('form-nisn').value = data.nisn || '';
                    
                    // Auto-calculate nominal based on jurusan
                    let nominal = 500000;
                    if(data.jurusan === 'TKJ') nominal = 450000;
                    else if(data.jurusan === 'Multimedia') nominal = 480000;
                    document.getElementById('nominal').value = nominal;
                }
            })
            .catch(err => console.error('Gagal mengambil profil:', err));

        // Generate Tagihan Bulanan Logic
        const renderTagihan = () => {
            const listEl = document.getElementById('tagihan-list');
            const today = new Date();
            const currentYear = today.getFullYear();
            const monthsStr = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'];
            const monthsName = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            
            let html = '';
            // Just display up to current month or max 8 months for demo
            const maxMonth = Math.min(11, today.getMonth() + 1);
            
            for(let i = maxMonth; i >= Math.max(0, maxMonth - 5); i--) {
                const val = `${currentYear}-${monthsStr[i]}`;
                html += `
                    <button type="button" onclick="selectBulan('${val}')" 
                            style="padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: white; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s;">
                        <span style="font-weight: 500;">Tagihan ${monthsName[i]} ${currentYear}</span>
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                `;
            }
            listEl.innerHTML = html;
        };

        window.selectBulan = (bulan) => {
            document.getElementById('bulan_spp').value = bulan;
            // Highlight effect
            const input = document.getElementById('bulan_spp');
            input.style.backgroundColor = '#dcfce7';
            setTimeout(() => input.style.backgroundColor = 'var(--background)', 1000);
        };

        renderTagihan();

        // Check if URL specifies a month (e.g. from Bayar Ulang)
        const urlParams = new URLSearchParams(window.location.search);
        const prefillBulan = urlParams.get('bulan');
        if (prefillBulan) {
            selectBulan(prefillBulan);
        }
    </script>
</body>
</html>
