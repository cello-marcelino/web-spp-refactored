<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pembayaran SPP - Siswa</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Placeholder -->
        <div id="sidebar-root" style="display: flex; height: 100vh;"></div>

        <!-- Main Content -->
        <main class="main-content">
            <h2>Bayar SPP</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Silakan isi formulir di bawah ini untuk membayar SPP.</p>

            <div class="card" style="max-width: 600px;">
                <!-- Endpoint matches our PaymentController route -->
                <form action="/api/payment/submit" method="POST" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="nama_siswa">Nama Lengkap</label>
                        <input type="text" id="nama_siswa" name="nama_siswa" class="form-control" required placeholder="Masukkan nama Anda">
                    </div>

                    <div style="display: flex; gap: 1rem;">
                        <div class="form-group" style="flex: 1;">
                            <label for="kelas">Kelas</label>
                            <input type="text" id="kelas" name="kelas" class="form-control" required placeholder="Contoh: XII">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="jurusan">Jurusan</label>
                            <input type="text" id="jurusan" name="jurusan" class="form-control" required placeholder="Contoh: RPL">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="nisn">NISN</label>
                        <input type="text" id="nisn" name="nisn" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="no_spp">Nomor SPP (Referensi)</label>
                        <input type="text" id="no_spp" name="no_spp" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="bulan_spp">Bulan Pembayaran</label>
                        <input type="month" id="bulan_spp" name="bulan_spp" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="nominal">Nominal (Rp)</label>
                        <input type="number" id="nominal" name="nominal" class="form-control" required min="10000" placeholder="500000">
                    </div>

                    <div class="form-group">
                        <label for="receipt">Bukti Transfer (Max 2MB, .jpg/png)</label>
                        <input type="file" id="receipt" name="receipt" class="form-control" accept=".jpg,.jpeg,.png" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Kirim Pembayaran</button>
                </form>
            </div>
        </main>
    </div>

    <script src="/js/components/sidebar.js"></script>
    <script>
        // Render Sidebar for Siswa
        SidebarComponent.render('siswa', '/dashboard_siswa/form_pembayaran.html');
    </script>
</body>
</html>
