<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pembayaran - Siswa</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Placeholder -->
        <div id="sidebar-root" style="display: flex; height: 100vh;"></div>

        <!-- Main Content -->
        <main class="main-content">
            <h2>Riwayat Pembayaran</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Daftar transaksi pembayaran SPP Anda.</p>

            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Bulan SPP</th>
                            <th>Nominal</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                        <!-- Data will be populated via JS -->
                        <tr><td colspan="4" style="text-align: center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="/js/components/sidebar.js"></script>
    <script>
        // Render Sidebar for Siswa
        SidebarComponent.render('siswa', '/dashboard_siswa/histori.html');
        
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('msg') === 'success') {
            alert('Pembayaran berhasil disubmit. Menunggu konfirmasi admin.');
            window.history.replaceState(null, '', window.location.pathname);
        }

        // Fetch Data from API
        fetch('/api/payment/history')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('history-table-body');
                if (data.error) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--danger)">Error: ${data.error}</td></tr>`;
                    return;
                }
                
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada riwayat pembayaran.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <tr>
                        <td>${item.tgl_bayar}</td>
                        <td>${item.bulan_spp}</td>
                        <td>Rp ${item.nominal.toLocaleString('id-ID')}</td>
                        <td><span class="badge badge-${item.status === 'success' ? 'success' : (item.status === 'rejected' ? 'rejected' : 'pending')}">${String(item.status).toUpperCase()}</span></td>
                        <td>
                            ${item.status === 'rejected' ? `<a href="/dashboard_siswa/form_pembayaran.html?bulan=${item.bulan_spp}" class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.85rem; text-decoration: none;">Bayar Ulang</a>` : '-'}
                        </td>
                    </tr>
                `).join('');
            })
            .catch(err => {
                document.getElementById('history-table-body').innerHTML = `<tr><td colspan="5">Gagal memuat data.</td></tr>`;
            });
    </script>
</body>
</html>
