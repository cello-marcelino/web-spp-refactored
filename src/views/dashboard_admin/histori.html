<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi Pembayaran - Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Placeholder -->
        <div id="sidebar-root" style="display: flex; height: 100vh;"></div>

        <!-- Main Content -->
        <main class="main-content">
            <h2>Daftar Pembayaran (Menunggu Validasi)</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Konfirmasi atau tolak transaksi dari siswa.</p>

            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Siswa</th>
                            <th>Bulan SPP</th>
                            <th>Nominal</th>
                            <th>Bukti</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body">
                        <tr><td colspan="6" style="text-align: center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="/js/components/sidebar.js"></script>
    <script>
        // Render Sidebar for Admin
        SidebarComponent.render('admin', '/dashboard_admin/histori.html');
        
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('msg') === 'updated') {
            alert('Status pembayaran berhasil diupdate.');
            window.history.replaceState(null, '', window.location.pathname);
        }

        // Fetch Data from API
        fetch('/api/payment/history')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('admin-table-body');
                if (data.error) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--danger)">Error: ${data.error}</td></tr>`;
                    return;
                }
                
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada riwayat pembayaran.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <tr>
                        <td>
                            <strong>${item.nama_siswa}</strong><br>
                            <small style="color: var(--text-muted)">${item.kelas} ${item.jurusan} - ${item.nisn}</small>
                        </td>
                        <td>${item.bulan_spp}</td>
                        <td>Rp ${item.nominal.toLocaleString('id-ID')}</td>
                        <td><a href="/uploads/${item.receipt_file}" target="_blank" style="color: var(--primary)">Lihat Bukti</a></td>
                        <td><span class="badge badge-${item.status === 'success' ? 'success' : (item.status === 'rejected' ? 'rejected' : 'pending')}">${item.status}</span></td>
                        <td>
                            ${item.status === 'pending' ? `
                                <a href="/api/payment/status?action=konfirmasi&id=${item.id_pembayaran}" class="btn btn-success" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Terima</a>
                                <a href="/api/payment/status?action=tolak&id=${item.id_pembayaran}" class="btn btn-danger" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Tolak</a>
                            ` : '-'}
                        </td>
                    </tr>
                `).join('');
            })
            .catch(err => {
                document.getElementById('admin-table-body').innerHTML = `<tr><td colspan="6">Gagal memuat data.</td></tr>`;
            });
    </script>
</body>
</html>
