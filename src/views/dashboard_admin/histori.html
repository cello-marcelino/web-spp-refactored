<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi Pembayaran - Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Placeholder -->
        <div id="sidebar-root" style="display: flex; height: 100vh;"></div>

        <!-- Main Content -->
        <main class="main-content">
            <h2>Daftar Pembayaran (Menunggu Validasi)</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Konfirmasi atau tolak transaksi dari siswa.</p>

            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Siswa</th>
                            <th>Bulan SPP</th>
                            <th>Nominal</th>
                            <th>Bukti</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body">
                        <!-- Data mockup -->
                        <tr>
                            <td>
                                <strong>Budi Santoso</strong><br>
                                <small style="color: var(--text-muted)">XII RPL - 123456789</small>
                            </td>
                            <td>Agustus 2026</td>
                            <td>Rp 500.000</td>
                            <td><a href="#" style="color: var(--primary)">Lihat Bukti</a></td>
                            <td><span class="badge badge-pending">Pending</span></td>
                            <td>
                                <!-- Admin action buttons hitting the GET endpoints -->
                                <a href="/api/payment/status?action=konfirmasi&id=1" class="btn btn-success" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Terima</a>
                                <a href="/api/payment/status?action=tolak&id=1" class="btn btn-danger" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Tolak</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="/js/components/sidebar.js"></script>
    <script>
        // Render Sidebar for Admin
        SidebarComponent.render('admin', '/dashboard_admin/histori.html');
        
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('msg') === 'updated') {
            alert('Status pembayaran berhasil diupdate.');
            window.history.replaceState(null, '', window.location.pathname);
        }
    </script>
</body>
</html>
